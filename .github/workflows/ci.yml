name: Django CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_DATABASE: employee_db
          MYSQL_USER: employee_user
          MYSQL_PASSWORD: employee_password
          MYSQL_ROOT_PASSWORD: root_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uemployee_user -pemployee_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: employee_db
          DB_USER: employee_user
          DB_PASSWORD: employee_password
          SECRET_KEY: test-secret-key
          DEBUG: "True"
        run: |
          python manage.py check

      - name: Check migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: employee_db
          DB_USER: employee_user
          DB_PASSWORD: employee_password
          SECRET_KEY: test-secret-key
          DEBUG: "True"
        run: |
          python manage.py makemigrations --check

      - name: Run migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: employee_db
          DB_USER: employee_user
          DB_PASSWORD: employee_password
          SECRET_KEY: test-secret-key
          DEBUG: "True"
        run: |
          python manage.py migrate

      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: employee_db
          DB_USER: employee_user
          DB_PASSWORD: employee_password
          SECRET_KEY: test-secret-key
          DEBUG: "True"
        run: |
          python manage.py test